  <text x="480.0" y="26" text-anchor="middle" fill="#24322a" font-size="12.5" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Quiet kiln</text>
  <text x="942" y="26" text-anchor="end" fill="rgba(36, 50, 42, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Celadon</text>

  <rect x="0" y="42" width="248" height="498" fill="#dce8de"/>
