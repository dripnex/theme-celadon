  <rect x="14" y="82" width="220" height="28" rx="8" fill="#cfdcd2"/>
  <text x="26" y="100" fill="rgba(36, 50, 42, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Search notes</text>

  <rect x="8" y="128" width="232" height="56" rx="8" fill="rgba(78, 138, 104, 0.2)"/><rect x="8" y="128" width="3" height="56" rx="1.5" fill="#4e8a68"/>
  <text x="22" y="152" fill="#4e8a68" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Quiet kiln</text><text x="22" y="170" fill="rgba(36, 50, 42, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">The glaze had cooled overnight...</text>
  <text x="22" y="216" fill="#24322a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">First firing</text><text x="22" y="234" fill="rgba(36, 50, 42, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Porcelain, then the jade pour.</text>
  <text x="22" y="280" fill="#24322a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Bowl notes</text><text x="22" y="298" fill="rgba(36, 50, 42, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">One vessel, then the page.</text>
  <text x="22" y="344" fill="#24322a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Kiln log</text><text x="22" y="362" fill="rgba(36, 50, 42, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Heat, wait, then the quiet.</text>

  <rect x="248" y="42" width="712" height="470" fill="#e7efe8"/>

  <text x="284" y="90" fill="#24322a" font-size="28" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Quiet kiln</text>
  <text x="284" y="114" fill="rgba(36, 50, 42, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Today &#183; Markdown</text>

  <text x="284" y="154" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">The glaze had cooled overnight when I sat down.</text>
  <text x="284" y="176" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">I wrote</text>
  <rect x="334" y="162" width="86" height="18" rx="4" fill="#cfdcd2"/>
  <text x="342" y="175" fill="#4e8a68" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace">openNote()</text>
  <text x="426" y="176" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">and let the porcelain settle &#8212; the page was the point.</text>

  <rect x="284" y="198" width="640" height="44" rx="6" fill="rgba(78, 138, 104, 0.1)"/>
  <rect x="284" y="198" width="4" height="44" rx="2" fill="#4e8a68"/>
  <text x="302" y="225" fill="rgba(36, 50, 42, 0.52)" font-size="14" font-style="italic" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Jade glaze on celadon paper. One bowl is enough.</text>

  <circle cx="292" cy="268" r="3" fill="#4e8a68"/>
  <text x="304" y="272" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">fire first</text>
  <circle cx="292" cy="292" r="3" fill="#4e8a68"/>
  <text x="304" y="296" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the note</text>
  <circle cx="292" cy="316" r="3" fill="#4e8a68"/>
  <text x="304" y="320" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the quiet</text>

  <text x="284" y="358" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">See also</text>
  <text x="344" y="358" fill="#4e8a68" font-size="14" text-decoration="underline" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">First firing</text>
  <text x="424" y="358" fill="#24322a" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">when the kiln cools.</text>

  <rect x="0" y="512" width="960" height="28" fill="#dce8de"/>
  <line x1="0" y1="512" x2="960" y2="512" stroke="rgba(36, 50, 42, 0.12)" stroke-width="1"/>
  <text x="16" y="530" fill="rgba(36, 50, 42, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Markdown</text>
  <text x="264" y="530" fill="rgba(36, 50, 42, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">128 words</text>
  <text x="944" y="530" text-anchor="end" fill="rgba(36, 50, 42, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Celadon</text>
